name: Veille Heimdall

on:
  schedule:
    - cron: "*/5 * * * *"  # minimum autorisé par GitHub ; les exécutions peuvent être décalées de quelques minutes
  workflow_dispatch:       # bouton "Run workflow" pour tester à la main
    inputs:
      ping:
        description: "Envoyer un message de test sur Telegram"
        type: boolean
        default: false

permissions:
  contents: write          # pour enregistrer l'état de la veille dans le dépôt

concurrency:
  group: veille
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-24.04  # version figée : ubuntu-latest passe à Ubuntu 26 le 19 octobre
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main          # toujours le dernier état, même si le passage a attendu dans la file

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Historique de prix (cache, hors dépôt)
        uses: actions/cache@v4
        with:
          path: data/prices
          key: prix-${{ github.run_id }}
          restore-keys: prix-

      - name: Passage de veille
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
        run: python -m heimdall.watcher --once ${{ inputs.ping && '--ping' || '' }}

      - name: Enregistrer l'état (news déjà vues, délais entre alertes)
        run: |
          git config user.name "heimdall-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/state data/universe.json
          git diff --cached --quiet && exit 0
          git commit -m "État de la veille" -q
          # Deux passages rapprochés peuvent se gêner : on réessaie, puis on abandonne sans échec
          # (les alertes sont déjà envoyées ; au pire une alerte sera répétée au passage suivant).
          for i in 1 2 3; do
            git pull --rebase -X theirs -q && git push -q && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((i * 5))
          done
          echo "::warning::État non enregistré (conflit), il sera recalculé au prochain passage"
